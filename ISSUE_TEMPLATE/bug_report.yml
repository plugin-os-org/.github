name: 🐛 Bug Report
description: Create a report to help us improve Plugin OS
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您的反馈！由于 Plugin OS 涉及复杂的进程隔离和 IPC 通信，请尽可能提供详尽的信息。
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: 您使用的操作系统是什么？
      options:
        - Windows (AppContainer)
        - Linux (Bubblewrap)
        - macOS (Seatbelt)
    validations:
      required: true
  - type: input
    id: host-version
    attributes:
      label: Host Version
      description: 宿主 (plugin-os-manager) 的版本号。
      placeholder: "e.g., 1.0.0"
    validations:
      required: true
  - type: textarea
    id: plugin-manifest
    attributes:
      label: Plugin Manifest
      description: 如果问题与特定插件相关，请粘贴 `plugin.toml` 的内容。
      render: toml
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: 复现该 Bug 的步骤。
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: 请粘贴宿主的报错日志或审计中心输出的 JSON 日志流。
      render: json