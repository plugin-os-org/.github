name: ✨ Feature Request
description: Suggest an idea for Plugin OS
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 您的功能请求是否与某个问题相关？
      description: 对问题的清晰简明描述。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 请描述您希望的解决方案。
      description: 对您希望发生的事情的清晰简明描述。
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 这会影响哪个组件？
      options:
        - SDK (Contract/Manifest)
        - Transport (IPC/Protocol)
        - Manager (Scheduler/WatchDog)
        - Internal Modules (Storage/Telemetry/Audit)
        - Developer Experience (Templates/CLI)